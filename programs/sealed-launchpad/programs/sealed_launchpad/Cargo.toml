[package]
name = "sealed_launchpad"
version = "0.1.0"
description = "Sealed-Block Launchpad with Fee-Credit Buyback Vault"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "sealed_launchpad"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []
# Relaxes the NON-mainnet minimum durations (commit >= 2s, reveal >= 2s, drip interval >= 1s)
# so the integration suite can run in seconds. Mainnet-configured protocols are never relaxed.
# Enabled only via `anchor test -- --features test-mode` (see package.json "test").
test-mode = []

[dependencies]
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.32.1", features = ["token", "associated_token"] }
solana-keccak-hasher = "2.2.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
